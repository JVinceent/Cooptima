    <section aria-label="Drop-off" style="background: #FFFFFF; border: 1px solid #E4E1D7; border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 14px">

        </div>
      </div>
      <button type="button" style="height: 50px; border-radius: 12px; border: 1px solid #8E8A7E; background: #FFFFFF; color: #1D1F1A; font: 600 16px 'DM Sans', sans-serif; cursor: pointer">Directions</button>
    </section>

    <div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px">
      <button type="button" style="height: 56px; border-radius: 14px; border: 0; background: #3F8113; color: #FFFFFF; font: 600 18px 'DM Sans', sans-serif; cursor: pointer">Mark delivered</button>
      <p style="margin: 0; color: #4A5045; font-size: 15px; text-align: center">The coop and Buyer A are told right away.</p>
